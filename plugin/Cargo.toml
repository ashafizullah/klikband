[package]
name = "klikband-astrobox"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
astrobox-ng-wit = "0.3.1"
tracing = "0.1"
tracing-subscriber = "0.3"
waki = "0.5.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
